name: Validate Godot Prototype

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Verify scientific manifest reproducibility
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path

          module = runpy.run_path("tools/science/generate_system_manifest.py")
          generated = module["build_manifest"]()
          manifest_path = Path("data/asterion_system.json")
          committed = json.loads(manifest_path.read_text(encoding="utf-8"))

          if committed != generated:
              print("Committed Asterion manifest does not match the deterministic science generator.")
              print("--- committed")
              print(json.dumps(committed, indent=2, sort_keys=True))
              print("--- generated")
              print(json.dumps(generated, indent=2, sort_keys=True))
              raise SystemExit(1)

          print("Asterion scientific manifest matches deterministic generator output.")
          PY

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a GDScript load/parse error."
            exit 1
          fi

      - name: Boot main scene and reject runtime script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-boot.log; then
            echo "Godot reported a runtime script error."
            exit 1
          fi
