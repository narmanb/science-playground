name: Validate Godot Prototype

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Import project and parse scripts
        run: godot --headless --path . --editor --quit

      - name: Boot main scene
        run: godot --headless --path . --quit-after 3
